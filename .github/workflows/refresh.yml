name: Refresh PlacidWay content

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Re-crawl the 7 source pages
        run: python -m scripts.ingest
      - name: Run tests against the new snapshot
        run: python -m pytest -q
      - name: Commit the snapshot if any page changed
        run: |
          if git diff --quiet -- data; then
            echo "No content changes."
            exit 0
          fi
          git config user.name "content-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/knowledge.json data/pages
          git commit -m "Refresh PlacidWay content snapshot"
          git push
